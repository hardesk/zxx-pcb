# Defaults also allow this file to be launched directly without Make.
if {![info exists RTT_PORT]} {set RTT_PORT 9090}
if {![info exists KEYBOARD_PORT]} {set KEYBOARD_PORT 9091}
if {![info exists TAPE_PORT]} {set TAPE_PORT 9092}
if {![info exists SWD_SPEED]} {set SWD_SPEED 5000}

adapter speed $SWD_SPEED
init
# Attach to running firmware. Resetting here can lose SWD access on core 1
# and also discards any TAP already buffered in RAM.
# If discovery fails, check that _SEGGER_RTT falls within the search range.
rtt setup 0x20000000 0x8000
rtt start
rtt polling_interval 10
rtt server start $RTT_PORT 0

# Dedicated keyboard down-channel; console remains on 9090/channel 0.
rtt server start $KEYBOARD_PORT 1

# Buffered TAP transfers and controls.
rtt server start $TAPE_PORT 2
